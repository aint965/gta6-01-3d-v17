<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palkon Auto — Solmar</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1526; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; color: #f2ede0; text-shadow: 0 1px 3px rgba(0,0,0,0.8); z-index: 2; }
  .panel { background: rgba(10, 20, 28, 0.55); border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; padding: 8px 12px; }
  #hud-topleft { top: 12px; left: 12px; max-width: 420px; }
  #hud-title { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
  #hud-district { font-size: 14px; margin-top: 2px; color: #ffd28a; }
  #hud-objective { font-size: 13px; margin-top: 4px; color: #d8e8e2; }
  #hud-compass { top: 12px; left: 50%; transform: translateX(-50%); font-size: 14px; letter-spacing: 1px; padding: 6px 14px; }
  #hud-minimap { bottom: 12px; left: 12px; }
  #hud-minimap .label { font-size: 11px; letter-spacing: 2px; color: #cfe0e6; margin-bottom: 4px; }
  #minimap { display: block; width: 220px; height: 200px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.25); }
  #hud-speed { bottom: 12px; right: 12px; text-align: right; }
  #hud-speed .num { font-size: 44px; font-weight: 800; line-height: 1; }
  #hud-speed .unit { font-size: 13px; color: #cfe0e6; }
  #hud-preset { font-size: 12px; margin-top: 4px; color: #ffd28a; }
  #hud-controls { bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; padding: 6px 14px; white-space: nowrap; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palkon Auto: drive Mara Venn through Solmar"></canvas>
<div class="hud panel" id="hud-topleft">
  <div id="hud-title">PALKON AUTO</div>
  <div id="hud-district">Solmar</div>
  <div id="hud-objective"></div>
</div>
<div class="hud panel" id="hud-compass"></div>
<div class="hud" id="hud-minimap">
  <div class="label">SOLMAR — MINIMAP</div>
  <canvas id="minimap" width="220" height="200"></canvas>
</div>
<div class="hud panel" id="hud-speed">
  <div><span class="num" id="hud-speed-num">0</span> <span class="unit">km/h</span></div>
  <div id="hud-preset"></div>
</div>
<div class="hud panel" id="hud-controls">WASD drive &nbsp;·&nbsp; 1/2/3 light &nbsp;·&nbsp; T cycle light &nbsp;·&nbsp; Q collect &nbsp;·&nbsp; X drop cargo &nbsp;·&nbsp; E interact</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
